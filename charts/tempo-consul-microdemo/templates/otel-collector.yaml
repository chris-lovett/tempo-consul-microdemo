{{- if .Values.otelCollector.enabled }}
# ─── ConfigMap: OTel Collector pipeline configuration ────────────────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  labels:
    app.kubernetes.io/name: otel-collector
    app.kubernetes.io/instance: {{ .Release.Name }}
data:
  config.yaml: |
    extensions:
      health_check:
        endpoint: "0.0.0.0:13133"

    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: "0.0.0.0:4317"
          http:
            endpoint: "0.0.0.0:4318"

    processors:
      batch:
        timeout: 5s
        send_batch_size: 512
      memory_limiter:
        check_interval: 1s
        limit_mib: 256
        spike_limit_mib: 64

    exporters:
      otlp:
        endpoint: {{ .Values.otelCollector.tempoEndpoint | quote }}
        tls:
          insecure: {{ .Values.otelCollector.tempoTLSInsecure }}
      {{- if .Values.otelCollector.debug }}
      debug:
        verbosity: detailed
      {{- end }}

    service:
      extensions: [health_check]
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters:
            - otlp
            {{- if .Values.otelCollector.debug }}
            - debug
            {{- end }}
---
# ─── Deployment ───────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  labels:
    app.kubernetes.io/name: otel-collector
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: otel-collector
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: otel-collector
        app.kubernetes.io/instance: {{ .Release.Name }}
      annotations:
        # The OTel Collector runs inside the Consul mesh so that app services can
        # reach it reliably via transparent proxy. Without a Consul service entry,
        # Envoy has no upstream cluster for the collector and silently drops gRPC
        # connections from mesh-injected pods.
        #
        # Probe rewriting suppression: Consul's connect-injector rewrites liveness/
        # readiness probes to Envoy admin ports by default, which breaks the
        # health_check extension on port 13133. Setting consul/service-port to the
        # collector's actual service port tells the injector the app is healthy and
        # suppresses the probe rewrite for the app container.
        consul.hashicorp.com/connect-inject: "true"
        consul.hashicorp.com/transparent-proxy: "true"
        consul.hashicorp.com/service-port: "13133"
        consul.hashicorp.com/enable-metrics-merging: "false"
    spec:
      serviceAccountName: otel-collector
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: otel-collector
          image: "{{ .Values.otelCollector.image.repository }}:{{ .Values.otelCollector.image.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          args:
            - "--config=/etc/otel/config.yaml"
          ports:
            - name: grpc-otlp
              containerPort: 4317
              protocol: TCP
            - name: http-otlp
              containerPort: 4318
              protocol: TCP
            - name: health
              containerPort: 13133
              protocol: TCP
            - name: metrics
              containerPort: 8888
              protocol: TCP
          volumeMounts:
            - name: config
              mountPath: /etc/otel
          readinessProbe:
            httpGet:
              path: /
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: health
            initialDelaySeconds: 10
            periodSeconds: 20
          {{- with .Values.otelCollector.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: config
          configMap:
            name: otel-collector-config
---
# ─── Service ──────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  labels:
    app.kubernetes.io/name: otel-collector
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: otel-collector
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: grpc-otlp
      port: {{ .Values.otelCollector.service.grpcPort }}
      protocol: TCP
      targetPort: grpc-otlp
    - name: http-otlp
      port: {{ .Values.otelCollector.service.httpPort }}
      protocol: TCP
      targetPort: http-otlp
    - name: metrics
      port: 8888
      protocol: TCP
      targetPort: metrics
{{- end }}
