# systemd drop-in: add OTel env vars to the api fake-service
#
# Install:
#   sudo mkdir -p /etc/systemd/system/api.service.d
#   sudo cp api-otel.conf /etc/systemd/system/api.service.d/otel.conf
#   sudo systemctl daemon-reload
#   sudo systemctl restart api

[Service]
Environment="TRACING_OTLP=true"
Environment="TRACING_OTLP_ENDPOINT=http://localhost:4317"
Environment="TRACING_OTLP_INSECURE=true"
