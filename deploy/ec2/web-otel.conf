# systemd drop-in: add OTel env vars to the web fake-service
#
# Install:
#   sudo mkdir -p /etc/systemd/system/web.service.d
#   sudo cp web-otel.conf /etc/systemd/system/web.service.d/otel.conf
#   sudo systemctl daemon-reload
#   sudo systemctl restart web
#
# fake-service OTel env var reference:
#   https://github.com/nicholasjackson/fake-service#tracing
#
# TRACING_OTLP_ENDPOINT points at the local OTel Collector agent (port 4317).
# The collector receives the spans and forwards them to ocp-dc through the
# mesh gateway peering tunnel.

[Service]
Environment="TRACING_OTLP=true"
Environment="TRACING_OTLP_ENDPOINT=http://localhost:4317"
Environment="TRACING_OTLP_INSECURE=true"
Environment="SERVER_UPSTREAM_INSECURE_SKIP_VERIFY=true"
