# Grafana Tempo — Helm values for production deployment
# Deploys Tempo in microservices mode (distributor, ingester, querier, query-frontend,
# compactor) backed by S3-compatible object storage.
#
# Install:
#   helm repo add grafana https://grafana.github.io/helm-charts
#   helm repo update
#   kubectl create namespace tempo
#   helm install tempo grafana/tempo-distributed \
#       --namespace tempo \
#       --values deploy/observability/tempo-values.yaml
#
# Reference: https://grafana.com/docs/tempo/latest/setup/helm-chart/
#
# ── AWS S3 setup ──────────────────────────────────────────────────────────────
# Before deploying, you need an S3 bucket and credentials. Two approaches:
#
# OPTION A — IRSA (IAM Roles for Service Accounts) — RECOMMENDED for ROSA/EKS
#   No static credentials. Tempo pods assume an IAM role via a Kubernetes
#   ServiceAccount annotation. Steps:
#     1. Create an S3 bucket (versioning not required, no public access):
#          aws s3api create-bucket \
#            --bucket <your-bucket-name> \
#            --region <your-region> \
#            --create-bucket-configuration LocationConstraint=<your-region>
#     2. Create an IAM policy (minimum required permissions):
#          {
#            "Version": "2012-10-17",
#            "Statement": [{
#              "Effect": "Allow",
#              "Action": [
#                "s3:PutObject",
#                "s3:GetObject",
#                "s3:DeleteObject",
#                "s3:ListBucket"
#              ],
#              "Resource": [
#                "arn:aws:s3:::<your-bucket-name>",
#                "arn:aws:s3:::<your-bucket-name>/*"
#              ]
#            }]
#          }
#     3. Create an IAM role with a trust policy scoped to the Tempo service accounts
#        (distributor, ingester, querier, compactor) and attach the policy above.
#     4. Annotate the Tempo service accounts in your override values:
#          serviceAccount:
#            annotations:
#              eks.amazonaws.com/role-arn: arn:aws:iam::<account-id>:role/<role-name>
#     5. Leave access_key and secret_key unset — the AWS SDK picks up the role automatically.
#
# OPTION B — Static credentials via Kubernetes Secret
#   Less preferred. Use only if IRSA is not available.
#     1. Create the secret (do NOT commit credentials to git):
#          kubectl create secret generic tempo-s3-credentials \
#            --from-literal=AWS_ACCESS_KEY_ID=<your-access-key> \
#            --from-literal=AWS_SECRET_ACCESS_KEY=<your-secret-key> \
#            --namespace tempo
#     2. Reference it in extraEnvFrom on each Tempo component (see commented
#        extraEnvFrom block in the storage section below).
#     3. Set access_key and secret_key to the env var references shown below.
#
# See deploy/observability/README.md for the full S3 setup walkthrough.
# ─────────────────────────────────────────────────────────────────────────────

tempo-distributed:
  # ─── Global ──────────────────────────────────────────────────────────────
  global:
    clusterDomain: cluster.local

  # ─── Object Storage ───────────────────────────────────────────────────────
  storage:
    trace:
      backend: s3
      s3:
        bucket: <your-bucket-name>          # e.g. tempo-traces-myorg-prod
        endpoint: s3.<your-region>.amazonaws.com  # e.g. s3.us-east-1.amazonaws.com
        region: <your-region>               # e.g. us-east-1

        # OPTION A (IRSA) — leave these unset; credentials come from the IAM role.
        # access_key:
        # secret_key:

        # OPTION B (static credentials) — reference the Secret created above.
        # access_key: ${AWS_ACCESS_KEY_ID}
        # secret_key: ${AWS_SECRET_ACCESS_KEY}

  # OPTION B only — inject the Secret as environment variables into every
  # Tempo component that reads from or writes to S3. Uncomment all four blocks.
  #
  # distributor:
  #   extraEnvFrom:
  #     - secretRef:
  #         name: tempo-s3-credentials
  # ingester:
  #   extraEnvFrom:
  #     - secretRef:
  #         name: tempo-s3-credentials
  # querier:
  #   extraEnvFrom:
  #     - secretRef:
  #         name: tempo-s3-credentials
  # compactor:
  #   extraEnvFrom:
  #     - secretRef:
  #         name: tempo-s3-credentials

  # ─── Receivers ────────────────────────────────────────────────────────────
  distributor:
    replicas: 2
    config:
      receivers:
        otlp:
          protocols:
            grpc:
              endpoint: "0.0.0.0:4317"
            http:
              endpoint: "0.0.0.0:4318"

  ingester:
    replicas: 3
    config:
      replication_factor: 3
    persistence:
      enabled: true
      size: 10Gi

  querier:
    replicas: 2

  queryFrontend:
    replicas: 2

  compactor:
    replicas: 1

  # ─── Retention ────────────────────────────────────────────────────────────
  config:
    compactor:
      compaction:
        block_retention: 720h  # 30 days

  # ─── Tracing-level search ─────────────────────────────────────────────────
  search:
    enabled: true

  # ─── Resource requests (tune for your cluster) ────────────────────────────
  ingester:
    resources:
      requests:
        cpu: 500m
        memory: 1Gi
      limits:
        cpu: "2"
        memory: 4Gi

  querier:
    resources:
      requests:
        cpu: 250m
        memory: 512Mi

  # ─── ServiceMonitor for Prometheus scraping ───────────────────────────────
  serviceMonitor:
    enabled: true
    interval: 30s
