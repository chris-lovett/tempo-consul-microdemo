# Grafana Tempo — Helm values for production deployment
# Deploys Tempo in microservices mode (distributor, ingester, querier, query-frontend,
# compactor) backed by S3-compatible object storage.
#
# Install:
#   helm repo add grafana https://grafana.github.io/helm-charts
#   helm repo update
#   kubectl create namespace tempo
#   helm install tempo grafana/tempo-distributed \
#       --namespace tempo \
#       --values deploy/observability/tempo-values.yaml
#
# Reference: https://grafana.com/docs/tempo/latest/setup/helm-chart/
#
# ── AWS S3 setup ──────────────────────────────────────────────────────────────
# Before deploying, you need an S3 bucket and credentials. Two approaches:
#
# OPTION A — IRSA (IAM Roles for Service Accounts) — RECOMMENDED for ROSA/EKS
#   No static credentials. Tempo pods assume an IAM role via a Kubernetes
#   ServiceAccount annotation. Steps:
#     1. Create an S3 bucket (versioning not required, no public access):
#          aws s3api create-bucket \
#            --bucket <your-bucket-name> \
#            --region <your-region> \
#            --create-bucket-configuration LocationConstraint=<your-region>
#     2. Create an IAM policy (minimum required permissions):
#          {
#            "Version": "2012-10-17",
#            "Statement": [{
#              "Effect": "Allow",
#              "Action": [
#                "s3:PutObject",
#                "s3:GetObject",
#                "s3:DeleteObject",
#                "s3:ListBucket"
#              ],
#              "Resource": [
#                "arn:aws:s3:::<your-bucket-name>",
#                "arn:aws:s3:::<your-bucket-name>/*"
#              ]
#            }]
#          }
#     3. Create an IAM role with a trust policy scoped to the Tempo service accounts
#        and attach the policy above.
#     4. Annotate the Tempo service account in your override values:
#          serviceAccount:
#            annotations:
#              eks.amazonaws.com/role-arn: arn:aws:iam::<account-id>:role/<role-name>
#     5. Leave access_key and secret_key unset — the AWS SDK picks up the role automatically.
#
# OPTION B — Static credentials via Kubernetes Secret
#   Less preferred. Use only if IRSA is not available.
#     1. Create the secret (do NOT commit credentials to git):
#          kubectl create secret generic tempo-s3-credentials \
#            --from-literal=AWS_ACCESS_KEY_ID=<your-access-key> \
#            --from-literal=AWS_SECRET_ACCESS_KEY=<your-secret-key> \
#            --namespace tempo
#     2. Reference it in extraEnvFrom on each Tempo component (see commented
#        extraEnvFrom block in the storage section below).
#     3. Set access_key and secret_key to the env var references shown below.
#
# See deploy/observability/README.md for the full S3 setup walkthrough.
# ─────────────────────────────────────────────────────────────────────────────

# ─── Global ──────────────────────────────────────────────────────────────────
global:
  clusterDomain: cluster.local

# ─── Service Account (IRSA) ───────────────────────────────────────────────────
# The chart creates a single shared SA named "tempo". Annotate it here.
serviceAccount:
  create: true
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::422772905643:role/tempo

# ─── Object Storage ───────────────────────────────────────────────────────────
storage:
  trace:
    backend: s3
    s3:
      bucket: tempo-demo-1
      endpoint: s3.us-east-2.amazonaws.com
      region: us-east-2

      # OPTION A (IRSA) — leave these unset; credentials come from the IAM role.
      # access_key:
      # secret_key:

      # OPTION B (static credentials) — reference the Secret created above.
      # access_key: ${AWS_ACCESS_KEY_ID}
      # secret_key: ${AWS_SECRET_ACCESS_KEY}

# OPTION B only — inject the Secret as environment variables into every
# Tempo component that reads from or writes to S3. Uncomment all four blocks.
#
# distributor:
#   extraEnvFrom:
#     - secretRef:
#         name: tempo-s3-credentials
# ingester:
#   extraEnvFrom:
#     - secretRef:
#         name: tempo-s3-credentials
# querier:
#   extraEnvFrom:
#     - secretRef:
#         name: tempo-s3-credentials
# compactor:
#   extraEnvFrom:
#     - secretRef:
#         name: tempo-s3-credentials

# ─── Tempo config (retention) ─────────────────────────────────────────────────
# The chart expects `config` as a raw YAML string, not a map. Set retention via
# the structured chart key instead.
tempo:
  retention: 720h  # 30 days

# ─── Receivers ────────────────────────────────────────────────────────────────
# ─── Trace receivers ──────────────────────────────────────────────────────────
# Enable OTLP receivers on the distributor. The chart uses a top-level `traces`
# key to toggle protocols — this sets the receiver to listen on 0.0.0.0 and
# adds the ports to the distributor service automatically.
traces:
  otlp:
    grpc:
      enabled: true
      receiverConfig:
        endpoint: "0.0.0.0:4317"
    http:
      enabled: true
      receiverConfig:
        endpoint: "0.0.0.0:4318"

distributor:
  replicas: 2
  podAnnotations:
    consul.hashicorp.com/connect-inject: "false"

ingester:
  replicas: 3
  config:
    replication_factor: 3
  persistence:
    enabled: true
    size: 10Gi
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 4Gi
  podAnnotations:
    consul.hashicorp.com/connect-inject: "false"

querier:
  replicas: 2
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
  podAnnotations:
    consul.hashicorp.com/connect-inject: "false"

queryFrontend:
  replicas: 2
  podAnnotations:
    consul.hashicorp.com/connect-inject: "false"

compactor:
  replicas: 1
  podAnnotations:
    consul.hashicorp.com/connect-inject: "false"

# ─── Metrics Generator ────────────────────────────────────────────────────────
# Optional component that derives RED metrics (rate/error/duration) from traces
# and remote-writes them to Prometheus. Powers the service graph and span rate
# charts in Grafana's Traces Drilldown view.
metricsGenerator:
  enabled: true
  replicas: 1
  podAnnotations:
    consul.hashicorp.com/connect-inject: "false"
  config:
    storage:
      path: /var/tempo/wal
      remote_write:
        - url: http://prometheus-kube-prometheus-prometheus.monitoring.svc.cluster.local:9090/api/v1/write
          send_exemplars: true

memcached:
  podAnnotations:
    consul.hashicorp.com/connect-inject: "false"

# ─── ServiceMonitor for Prometheus scraping ───────────────────────────────────
serviceMonitor:
  enabled: true
  interval: 30s
