# Prometheus (kube-prometheus-stack) — Helm values for ROSA deployment
#
# The kube-prometheus-stack chart bundles Prometheus, Alertmanager, and the
# Prometheus Operator in one release. It is the recommended approach for
# standalone Prometheus on OpenShift.
#
# Install:
#   helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
#   helm repo update
#   kubectl create namespace monitoring
#   oc adm policy add-scc-to-user anyuid \
#     system:serviceaccount:monitoring:prometheus-kube-prometheus-prometheus \
#     system:serviceaccount:monitoring:prometheus-kube-prometheus-operator \
#     system:serviceaccount:monitoring:prometheus-kube-prometheus-admission \
#     system:serviceaccount:monitoring:default
#   oc adm policy add-scc-to-user privileged \
#     system:serviceaccount:monitoring:prometheus-kube-prometheus-prometheus \
#     system:serviceaccount:monitoring:prometheus-kube-prometheus-operator \
#     system:serviceaccount:monitoring:prometheus-kube-prometheus-admission \
#     system:serviceaccount:monitoring:default
#   helm install prometheus prometheus-community/kube-prometheus-stack \
#       --namespace monitoring \
#       --values deploy/observability/prometheus-values.yaml
#
# Upgrade after changes:
#   helm upgrade prometheus prometheus-community/kube-prometheus-stack \
#       --namespace monitoring \
#       --values deploy/observability/prometheus-values.yaml

# ─── Scope: disable components already handled by OpenShift ──────────────────
# OpenShift ships its own kube-state-metrics and node-exporter in
# openshift-monitoring. Disable the stack's copies to avoid duplication.
kubeStateMetrics:
  enabled: false

nodeExporter:
  enabled: false

# Disable scraping of OpenShift's own control-plane components — those are
# already covered by the platform monitoring stack.
kubeEtcd:
  enabled: false
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false

# ─── Grafana: disable — we deploy Grafana separately ─────────────────────────
grafana:
  enabled: false

# ─── Consul sidecar injection — opt out ──────────────────────────────────────
# Consul's mutating webhook injects sidecars into every pod by default.
# The sre-podimagespec-mutation webhook also adds seccomp annotations cluster-wide.
# Both cause SCC violations on ROSA. Opt out at the pod level here and grant
# privileged SCC (see install commands above) to allow the seccomp annotations.
commonLabels: {}  # placeholder — podAnnotations are set per-component below

# ─── Prometheus ───────────────────────────────────────────────────────────────
prometheus:
  # Opt out of Consul sidecar injection on Prometheus pods
  podAnnotations:
    consul.hashicorp.com/connect-inject: "false"
  prometheusSpec:
    # Watch ServiceMonitors in all namespaces (including tracing-demo).
    # Narrow this if you want tighter scope.
    serviceMonitorNamespaceSelector: {}
    serviceMonitorSelector: {}

    # Watch PodMonitors in all namespaces.
    podMonitorNamespaceSelector: {}
    podMonitorSelector: {}

    retention: 15d

    # Accept remote_write from Tempo metrics-generator
    enableRemoteWriteReceiver: true

    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        cpu: "1"
        memory: 2Gi

    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 20Gi

    # ROSA: runAsUser/fsGroup 65534 is outside the namespace UID range.
    # anyuid SCC (granted above) allows this fixed UID.
    securityContext:
      runAsNonRoot: true
      runAsUser: 65534
      fsGroup: 65534

# ─── Alertmanager ─────────────────────────────────────────────────────────────
alertmanager:
  enabled: false   # set true if you want alerting

# ─── Prometheus Operator ──────────────────────────────────────────────────────
prometheusOperator:
  # Opt out of Consul sidecar injection on the operator pod
  podAnnotations:
    consul.hashicorp.com/connect-inject: "false"
  admissionWebhooks:
    enabled: true
  securityContext:
    runAsNonRoot: true
  containerSecurityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    readOnlyRootFilesystem: true
    runAsNonRoot: true
